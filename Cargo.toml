[package]
name = "fleet-coordinate"
version = "0.1.0"
edition = "2021"
description = "Geometric constraint satisfaction for fleet coordination — zero voting, zero drift, proven convergence"
repository = "https://github.com/SuperInstance/fleet-coordinate"
readme = "README.md"
license = "MIT"
keywords = ["fleet", "consensus", "holonomy", "constraint-theory", "cohomology"]
categories = ["distributed-systems", "algorithms", "mathematics"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
approx = "0.5"

[lib]
path = "src/lib.rs"

[[test]]
name = "zhc_tests"
path = "tests/zhc_tests.rs"

[[test]]
name = "beam_tests"
path = "tests/beam_tests.rs"

[[test]]
name = "integration_tests"
path = "tests/integration_tests.rs"
