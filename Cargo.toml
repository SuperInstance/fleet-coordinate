[package]
name = "fleet-coordinate"
version = "0.1.0"
edition = "2021"
description = "Fleet coordination via zero-holonomy consensus and Laman rigidity"
readme = "README.md"
license = "MIT"
repository = "https://github.com/SuperInstance/fleet-coordinate"
keywords = ["consensus", "fleet", "rigidity", "coordination", "holonomy"]
categories = ["concurrency", "distributed", "network"]
rust-version = "1.70"

[dependencies]
pythagorean48-codes = { path = "../pythagorean48-codes" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
approx = "0.5"
criterion = "0.5"

[lib]
path = "src/lib.rs"

[[test]]
name = "zhc_tests"
path = "tests/zhc_tests.rs"

[[test]]
name = "beam_tests"
path = "tests/beam_tests.rs"

[[test]]
name = "integration_tests"
path = "tests/integration_tests.rs"
